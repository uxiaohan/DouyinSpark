services:
  douyinspark:
    image: ghcr.io/uxiaohan/douyinspark:${DOUYIN_TAG:-latest}
    container_name: douyinspark
    restart: unless-stopped
    # Chromium 默认只用 64MB /dev/shm，页面一复杂就崩；放大到 1GB
    shm_size: "1gb"
    ports:
      - "${DOUYIN_PORT:-8787}:8787"
    environment:
      TZ: "${DOUYIN_TZ:-Asia/Shanghai}"
    volumes:
      - ./data:/app/data
    # 容器日志不设上限会把磁盘吃光；滚动保留最近 3 份 10MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"