# 本地构建版：从当前源码 build 再运行，改代码自测用。
# 默认的 docker-compose.yml 是「直接运行 GHCR 已发布镜像」版本；两者都挂 ./data 到 /app/data，
# 指向同一份数据，别同时跑（SQLite 会撞锁）。
# 容器常驻，调度循环随容器一起活着
services:
  douyinspark:
    build: .
    image: douyinspark:latest
    container_name: douyinspark
    restart: unless-stopped
    # 同 docker-compose.yml：宽限要比优雅停机的 2 分钟长，10s 默认宽限会 SIGKILL 掉正在收尾的运行
    stop_grace_period: 2m10s
    # Chromium 默认只用 64MB /dev/shm，页面一复杂就崩；放大到 1GB
    shm_size: "1gb"
    ports:
      - "${DOUYIN_PORT:-8787}:8787"
    environment:
      TZ: "${DOUYIN_TZ:-Asia/Shanghai}"
    volumes:
      - ./data:/app/data
    # 容器日志不设上限会把磁盘吃光；滚动保留最近 3 份 10MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
